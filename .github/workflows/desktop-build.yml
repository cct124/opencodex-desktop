name: Desktop installers

on:
  push:
    branches: ['**']
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: desktop-installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win32-x64
            runner: windows-2022
          - platform: darwin-arm64
            runner: macos-15
          - platform: darwin-x64
            runner: macos-15-intel
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      DESKTOP_BUILD_PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup project Bun
        uses: ./.github/actions/setup-project-bun

      - name: Validate desktop version and release tag
        run: node .github/scripts/desktop-release.cjs validate-ref

      - name: Install locked dependencies
        run: |
          bun install --frozen-lockfile
          bun install --cwd gui --frozen-lockfile
          bun install --cwd desktop-fork --frozen-lockfile

      - name: Setup pinned Rust
        run: |
          rustup toolchain install 1.92.0 --profile minimal
          rustup override set 1.92.0
          cargo fetch --locked --manifest-path desktop-fork/src-tauri/Cargo.toml

      - name: Check types and desktop regressions
        run: |
          bun run typecheck
          bun x tsc --project desktop-fork/tsconfig.json --noEmit
          bun test --cwd desktop-fork ./tests
          bun test ./tests/codex-integration/gpt6-native-rows.test.ts ./tests/codex-integration/native-model-toggle.test.ts ./tests/server/management-desktop-preview.test.ts --timeout 60000
          cargo test --locked --offline --manifest-path desktop-fork/src-tauri/Cargo.toml

      - name: Build native installer
        run: bun run desktop-fork/scripts/build-installer.ts

      - name: Smoke test the packaged runtime (Windows)
        if: runner.os == 'Windows'
        run: cargo run --locked --offline --manifest-path desktop-fork/src-tauri/Cargo.toml --example runtime-probe -- package

      - name: Verify app signature and bundled runtime (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict "desktop-fork/src-tauri/target/release/bundle/macos/OpenCodex Desktop.app"
          bun run desktop-fork/scripts/package-smoke.ts "desktop-fork/src-tauri/target/release/bundle/macos/OpenCodex Desktop.app/Contents/Resources/runtime"

      - name: Upload installers and checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opencodex-desktop-${{ matrix.platform }}-${{ github.sha }}
          path: desktop-fork/.bundle/artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  verify-release:
    name: Verify release assets
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Download this run's installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: opencodex-desktop-*-${{ github.sha }}
          path: release-artifacts
          merge-multiple: false

      - name: Verify all platforms, versions, commit and checksums
        run: node .github/scripts/desktop-release.cjs verify-artifacts release-artifacts

  release:
    name: Publish desktop prerelease
    needs: [build, verify-release]
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Download this run's installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: opencodex-desktop-*-${{ github.sha }}
          path: release-artifacts
          merge-multiple: false

      # Only this tag-gated job has write permission. It installs no dependencies
      # and never executes downloaded installers. Complete drafts before publishing.
      - name: Publish verified assets
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { publishRelease } = require('./.github/scripts/desktop-release.cjs');
            const url = await publishRelease({ github, context, directory: 'release-artifacts', repoRoot: process.cwd() });
            core.notice(`Desktop release: ${url}`);
