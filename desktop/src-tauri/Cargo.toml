[package]
name = "opencodex-desktop"
version = "0.1.1"
edition = "2021"
license = "MIT"
publish = false

[build-dependencies]
serde_json = "1"
tauri-build = { version = "=2.6.2", features = [] }

[dependencies]
tauri = { version = "=2.11.2", features = ["tray-icon"] }
tauri-plugin-opener = "=2.5.4"
tauri-plugin-single-instance = "=2.4.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dunce = "=1.0.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_Packaging_Appx", "Win32_System_Environment", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_Security", "Win32_UI_WindowsAndMessaging"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
