<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenCodex Desktop</title><link rel="stylesheet" href="style.css"></head>
<body>
  <main>
    <div class="badge">OPENCODEX · DESKTOP</div>
    <h1>正在启动</h1>
    <p id="message" role="status">正在准备独立的开发实例…</p>
    <div class="progress" aria-hidden="true"></div>
    <p class="hint">开发预览使用独立配置，首次启动不包含已有账户和模型设置。</p>
    <details><summary>启动日志位置</summary><pre id="log"></pre></details>
    <button id="quit">关闭应用</button>
  </main>
  <script src="app.js"></script>
</body>
</html>
